<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda noche...</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.min.css">
</head>
<body>
    <main>
        <div class="title">
            <h1>La <span class="blue">segunda</span> noche comenzará <span class="pink">pronto...</span></h1>
        </div>
        <div class="button-section">
            <button class="trailer-btn" id="cinematic-btn">Ver Avance</button>
        </div>

        <div class="repro"></div>
        
        <div class="video-container" id="vid-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/fmhF7EGZ8Wc?si=T_A01u9Ce5EZ_i8Q" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <button id="quit-button"><i class="ph ph-x"></i></button>
        </div>

        <div class="music-btn">
            <button id="audio-btn"><i class="ph ph-speaker-simple-high"></i></button>
        </div>
    </main>

    <audio src="Music/secondnight.mp3" loop playsinline preload="auto" muted id="secondnight-audio"></audio>
    <script src="JS/index.js"></script>
</body>
</html>
